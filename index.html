<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📈 ETF 계산기</title>
    <style>
        body {
            font-family: 'Malgun Gothic', Arial, sans-serif;
            background: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        h2 {
            color: #ff3b3b;
            margin-bottom: 10px;
        }

        #message {
            color: #ff3b3b;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            animation: pulse 2s infinite;
            margin-bottom: 15px;
            min-height: 20px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 16px;
            background: #222;
            color: #aaa;
            border: 2px solid #444;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #ff3b3b;
            color: #fff;
            border-color: #ff3b3b;
        }

        .tab-btn:hover {
            border-color: #ff3b3b;
        }

        .tab-content {
            display: none;
            text-align: center;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .input-section {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: left;
            max-width: 400px;
        }

        .input-group {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: space-between;
        }

        .input-group label {
            font-size: 13px;
            color: #aaa;
            min-width: 80px;
        }

        .input-group input {
            width: 120px;
            padding: 8px;
            font-size: 14px;
            text-align: right;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff3b3b;
            box-shadow: 0 0 8px rgba(255, 59, 59, 0.3);
        }

        .toggle-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px;
            font-size: 12px;
            background: #222;
            color: #aaa;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background: #ff3b3b;
            color: #fff;
            border-color: #ff3b3b;
        }

        .button-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
        }

        button {
            padding: 8px 16px;
            background: #ff3b3b;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover {
            background: #ff5555;
        }

        button:active {
            background: #d32f2f;
        }

        table {
            border-collapse: collapse;
            margin: 0 auto;
            max-width: 400px;
        }

        td, th {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: right;
            font-size: 14px;
        }

        th {
            background-color: #222;
            color: #aaa;
            font-size: 12px;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #1a1a1a;
        }

        .positive { color: #ff3b3b; }
        .negative { color: #3b82ff; }

        .gauge-container {
            margin-top: 15px;
            text-align: center;
        }

        .gauge-bar {
            width: 300px;
            height: 30px;
            background: linear-gradient(90deg, #3b82ff 0%, #444 48%, #444 52%, #ff3b3b 100%);
            border-radius: 6px;
            margin: 10px auto;
            position: relative;
            overflow: hidden;
        }

        .gauge-needle {
            position: absolute;
            top: 0;
            width: 3px;
            height: 100%;
            background: #fff;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        .gauge-label {
            font-size: 18px;
            font-weight: bold;
            color: #ff3b3b;
            margin: 10px 0;
        }

        .gauge-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
        }

        .gap-high { background: #3a1c22; color: #ff3b3b; }
        .gap-low { background: #1c2a44; color: #3b82ff; }
        .gap-flat { background: #222; color: #aaa; }

        .result-info {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
            color: #aaa;
            line-height: 1.6;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 5px #ff4d4d; }
            50% { text-shadow: 0 0 20px #ff1a1a; }
            100% { text-shadow: 0 0 5px #ff4d4d; }
        }
    </style>
</head>
<body>

    <h2>📈 ETF 계산기</h2>
    <p id="message"></p>

    <div class="tabs">
        <button class="tab-btn active" data-tab="avg">01 평단가</button>
        <button class="tab-btn" data-tab="sell">02 목표매도가</button>
        <button class="tab-btn" data-tab="gap">03 괴리율</button>
        <button class="tab-btn" data-tab="navcalc">04 NAV 계산</button>
    </div>

    <!-- TAB 1: 평단가 계산 -->
    <div id="tab-avg" class="tab-content active">
        <div class="input-section">
            <div class="input-group">
                <label>현재 보유수량</label>
                <input type="number" id="a-qty1" value="79" placeholder="주">
            </div>
            <div class="input-group">
                <label>현재 평단가</label>
                <input type="number" id="a-avg1" value="22873" placeholder="원">
            </div>
            <div class="input-group">
                <label>추가매수 단가</label>
                <input type="number" id="a-price2" value="19800" placeholder="원">
            </div>
            <div class="input-group">
                <label style="color:#ff3b3b; font-weight:bold;">목표 평단가</label>
                <input type="number" id="a-target" value="20000" placeholder="원" style="color:#ff3b3b; font-weight:bold;">
            </div>
            <div class="input-group">
                <label>수수료율</label>
                <input type="number" id="a-fee" value="0.015" step="0.001" placeholder="%">
            </div>
        </div>
        <div class="button-group">
            <button onclick="calcAvg()">계산하기</button>
            <button onclick="copyResultAvg()">결과 복사</button>
        </div>
        <div id="result-avg"></div>
        <div class="result-info">
            💡 목표 평단가에 도달하기 위해 추가매수 단가에서 몇 주를 더 사야 하는지 계산합니다.
        </div>
    </div>

    <!-- TAB 2: 목표매도가 -->
    <div id="tab-sell" class="tab-content">
        <div class="input-section">
            <div class="input-group">
                <label>평단가</label>
                <input type="number" id="s-avg" value="12500" placeholder="원">
            </div>
            <div class="input-group">
                <label>보유 수량</label>
                <input type="number" id="s-qty" value="150" placeholder="주">
            </div>
            <div class="input-group">
                <label>목표 수익률</label>
                <input type="number" id="s-target" value="10" step="0.5" placeholder="%">
            </div>
            <div class="input-group">
                <label>매도 수수료</label>
                <input type="number" id="s-fee" value="0.015" step="0.001" placeholder="%">
            </div>
            <div style="margin-top:15px;">
                <label style="display:block; font-size:13px; color:#aaa; margin-bottom:8px;">과세 구분</label>
                <div class="toggle-group">
                    <button class="toggle-btn active" data-tax="0" onclick="setTax(0, this)">국내주식형 (비과세)</button>
                    <button class="toggle-btn" data-tax="15.4" onclick="setTax(15.4, this)">그 외 ETF (15.4%)</button>
                </div>
            </div>
        </div>
        <div class="button-group">
            <button onclick="calcSell()">계산하기</button>
            <button onclick="copyResultSell()">결과 복사</button>
        </div>
        <div id="result-sell"></div>
        <div class="result-info">
            💡 국내 주식형 ETF는 매매차익 비과세, 해외지수·채권형·파생형은 배당소득세 15.4% 과세
        </div>
    </div>

    <!-- TAB 3: 괴리율 (단일 입력 + 게이지) -->
    <div id="tab-gap" class="tab-content">
        <div class="input-section">
            <div class="input-group">
                <label>ETF 괴리율(%)</label>
                <input type="number" id="g-gap" step="0.01" placeholder="+0.15 또는 -0.35" oninput="calcGap()">
            </div>
        </div>
        <div class="button-group">
            <button onclick="copyResultGap()">결과 복사</button>
        </div>
        <div id="result-gap"></div>
        <div class="gauge-container">
            <div class="gauge-bar">
                <div class="gauge-needle" id="gap-needle" style="left:50%;"></div>
            </div>
            <div class="gauge-label" id="gap-pct">+0.00%</div>
            <div class="gauge-tag gap-flat" id="gap-tag">🟢 정상</div>
        </div>
        <div class="result-info">
            💡 ETF 괴리율(%)만 입력하면 즉시 평가됩니다. ±0.2% 이내 정상, ±0.5% 이내 관찰, ±1% 이내 주의, 그 이상은 고평가/저평가로 표시됩니다.
        </div>
    </div>

    <!-- TAB 4: NAV 계산 (NAV + 괴리율 → 시장가) -->
    <div id="tab-navcalc" class="tab-content">
        <div class="input-section">
            <div class="input-group">
                <label>NAV (순자산가치)</label>
                <input type="number" id="n-nav" value="20000" placeholder="원" oninput="calcNavPrice()">
            </div>
            <div class="input-group">
                <label>괴리율(%)</label>
                <input type="number" id="n-gap" step="0.01" value="0.35" placeholder="+0.35" oninput="calcNavPrice()">
            </div>
        </div>
        <div class="button-group">
            <button onclick="copyResultNav()">결과 복사</button>
        </div>
        <div id="result-nav"></div>
        <div class="result-info">
            💡 NAV와 괴리율을 입력하면 예상 시장가격과 할증/할인 금액을 계산합니다.
        </div>
    </div>

    <script>
        const messages = [
            "🔥 붉은 주가가 솟는다. 나의 의지가 파동이 된다.",
            "🌅 붉은 주가, 그건 단순한 숫자가 아니라 내 흐름의 증거다.",
            "🌠 오늘도 붉은 주가가 떠오른다. 운과 나의 맥이 하나로 이어진다.",
            "🔥 붉은 주가의 불꽃이 깨어난다. 계산은 끝, 상승은 시작이다.",
            "💫 붉은 주가가 춤춘다. 나는 우주의 리듬을 타고 흐른다.",
            "🚀 붉은 주가, 나의 신호. 상승은 이미 결정되었다."
        ];
        document.getElementById("message").textContent = messages[Math.floor(Math.random() * messages.length)];

        // 탭 전환 + 자동 포커스
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + tab).classList.add('active');

                // 괴리율 탭이면 입력창에 포커스
                if (tab === 'gap') {
                    setTimeout(() => document.getElementById('g-gap')?.focus(), 100);
                } else if (tab === 'navcalc') {
                    setTimeout(() => document.getElementById('n-nav')?.focus(), 100);
                }
            });
        });

        let taxRate = 0;
        function setTax(rate, btn) {
            taxRate = rate;
            btn.parentElement.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        const fmt = n => isFinite(n) ? Math.round(n).toLocaleString('ko-KR') : '0';
        const fmtDec = (n, d=2) => isFinite(n) ? n.toFixed(d) : '0.00';

        function calcAvg() {
            const qty1 = parseFloat(document.getElementById('a-qty1').value) || 0;
            const avg1 = parseFloat(document.getElementById('a-avg1').value) || 0;
            const price2 = parseFloat(document.getElementById('a-price2').value) || 0;
            const target = parseFloat(document.getElementById('a-target').value) || 0;
            const feeRate = (parseFloat(document.getElementById('a-fee').value) || 0) / 100;

            if (qty1 <= 0 || avg1 <= 0 || price2 <= 0 || target <= 0) {
                alert('모든 값을 정확히 입력하세요!');
                return;
            }
            if (Math.abs(price2 - target) < 0.01) {
                alert('추가매수 단가와 목표평단가가 같으면 계산이 불가능합니다!');
                return;
            }

            let qty2 = qty1 * (target - avg1) / (price2 - target);
            if (qty2 < 0) {
                alert('목표 평단가 달성이 불가능합니다!');
                return;
            }
            qty2 = Math.round(qty2);

            const cost1 = qty1 * avg1;
            const cost2 = qty2 * price2;
            const totalCost = cost1 + cost2;
            const totalQty = qty1 + qty2;
            const newAvg = totalQty > 0 ? totalCost / totalQty : 0;
            const fee = cost2 * feeRate;
            const totalWithFee = totalCost + fee;
            const avgWithFee = totalWithFee / totalQty;

            document.getElementById('result-avg').innerHTML = `
                <table>
                    <tr><th>항목</th><th>값</th></tr>
                    <tr><td class="positive" style="font-weight:bold;">추가 매수 수량</td><td class="positive" style="font-weight:bold;">${qty2.toLocaleString('ko-KR')}주</td></tr>
                    <tr><td>추가 매수 금액</td><td>${fmt(cost2)}</td></tr>
                    <tr><td>추가 수수료</td><td>${fmt(fee)}</td></tr>
                    <tr><th colspan="2" style="padding:10px; background:#222;">매수 완료 후</th></tr>
                    <tr><td>총 보유수량</td><td>${totalQty.toLocaleString('ko-KR')}주</td></tr>
                    <tr><td>총 매입금액</td><td>${fmt(totalCost)}</td></tr>
                    <tr><td class="positive">예상 평단가</td><td class="positive">${fmt(Math.round(newAvg))}</td></tr>
                    <tr><td>수수료 포함 평단가</td><td>${fmt(Math.round(avgWithFee))}</td></tr>
                </table>`;
        }

        function calcSell() {
            const avg = parseFloat(document.getElementById('s-avg').value) || 0;
            const qty = parseFloat(document.getElementById('s-qty').value) || 0;
            const target = (parseFloat(document.getElementById('s-target').value) || 0) / 100;
            const feeRate = (parseFloat(document.getElementById('s-fee').value) || 0) / 100;

            const cost = avg * qty;
            const targetProfit = cost * target;
            let sellAmt;
            if (taxRate <= 0) {
                sellAmt = (targetProfit + cost) / (1 - feeRate);
            } else {
                const t = taxRate / 100;
                sellAmt = (cost + targetProfit / (1 - t)) / (1 - feeRate);
            }

            const sellPrice = qty > 0 ? sellAmt / qty : 0;
            const sellFee = sellAmt * feeRate;
            const preTaxProfit = sellAmt - cost - sellFee;
            const tax = taxRate > 0 ? Math.max(0, preTaxProfit) * (taxRate / 100) : 0;
            const realized = preTaxProfit - tax;
            const rate = cost > 0 ? (realized / cost * 100) : 0;

            document.getElementById('result-sell').innerHTML = `
                <table>
                    <tr><th>항목</th><th>값</th></tr>
                    <tr><td>매입금액</td><td>${fmt(cost)}</td></tr>
                    <tr><td class="positive">목표 매도단가</td><td class="positive">${fmt(Math.round(sellPrice))}</td></tr>
                    <tr><td>예상 매도금액</td><td>${fmt(sellAmt)}</td></tr>
                    <tr><td>수수료+세금</td><td>${fmt(sellFee + tax)}</td></tr>
                    <tr><td class="positive">실현손익</td><td class="positive">+${fmt(realized)}</td></tr>
                    <tr><td class="positive">수익률</td><td class="positive">+${rate.toFixed(2)}%</td></tr>
                </table>`;
        }

        function calcGap() {
            const pct = parseFloat(document.getElementById("g-gap").value) || 0;
            let label = "", cls = "";

            if (Math.abs(pct) <= 0.2) {
                label = "🟢 정상";
                cls = "gap-flat";
            } else if (Math.abs(pct) <= 0.5) {
                label = "🟡 관찰";
                cls = "gap-flat";
            } else if (Math.abs(pct) <= 1) {
                label = pct > 0 ? "🟠 할증 주의" : "🟠 할인 주의";
                cls = pct > 0 ? "gap-high" : "gap-low";
            } else {
                label = pct > 0 ? "🔴 고평가" : "🔵 저평가";
                cls = pct > 0 ? "gap-high" : "gap-low";
            }

            const clamped = Math.max(-3, Math.min(3, pct));
            const left = 50 + (clamped / 3) * 50;
            document.getElementById("gap-needle").style.left = left + "%";
            document.getElementById("gap-pct").textContent = (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%";
            document.getElementById("gap-tag").className = "gauge-tag " + cls;
            document.getElementById("gap-tag").textContent = label;

            document.getElementById("result-gap").innerHTML = `
                <table>
                    <tr><th>항목</th><th>값</th></tr>
                    <tr><td>ETF 괴리율</td><td class="${pct >= 0 ? 'positive' : 'negative'}">${(pct >= 0 ? '+' : '')}${pct.toFixed(2)}%</td></tr>
                    <tr><td>등급</td><td>${label}</td></tr>
                </table>`;
        }

        function calcNavPrice() {
            const nav = parseFloat(document.getElementById('n-nav').value) || 0;
            const gapPct = parseFloat(document.getElementById('n-gap').value) || 0;
            const marketPrice = nav * (1 + gapPct / 100);
            const diff = marketPrice - nav;
            const absDiff = Math.abs(diff);
            const sign = diff >= 0 ? '+' : '-';

            let state = "";
            if (Math.abs(gapPct) <= 0.2) state = "🟢 정상";
            else if (Math.abs(gapPct) <= 0.5) state = "🟡 관찰";
            else if (Math.abs(gapPct) <= 1) state = gapPct > 0 ? "🟠 할증 주의" : "🟠 할인 주의";
            else state = gapPct > 0 ? "🔴 고평가" : "🔵 저평가";

            document.getElementById('result-nav').innerHTML = `
                <table>
                    <tr><th>항목</th><th>값</th></tr>
                    <tr><td>NAV</td><td>${fmt(nav)} 원</td></tr>
                    <tr><td>괴리율</td><td class="${gapPct >= 0 ? 'positive' : 'negative'}">${(gapPct >= 0 ? '+' : '')}${gapPct.toFixed(2)}%</td></tr>
                    <tr><td class="positive">예상 시장가</td><td class="positive">${fmt(marketPrice)} 원</td></tr>
                    <tr><td>괴리금액</td><td class="${diff >= 0 ? 'positive' : 'negative'}">${sign}${fmt(absDiff)} 원</td></tr>
                    <tr><td>상태</td><td>${state}</td></tr>
                </table>`;
        }

        function copyResultAvg() {
            if (!document.getElementById('result-avg').innerHTML.trim()) { alert('먼저 계산하세요!'); return; }
            const qty1 = document.getElementById('a-qty1').value;
            const avg1 = document.getElementById('a-avg1').value;
            const price2 = document.getElementById('a-price2').value;
            const target = document.getElementById('a-target').value;
            let text = `【목표 평단가 계산】\n현재 보유: ${qty1}주 @ ${fmt(avg1)}\n목표 평단가: ${fmt(target)}\n추가매수 단가: ${fmt(price2)}\n\n`;
            document.querySelectorAll('#result-avg table tr').forEach(r => {
                text += [...r.cells].map(c => c.innerText).join('\t') + '\n';
            });
            navigator.clipboard.writeText(text).then(() => alert('결과가 복사되었습니다!'));
        }

        function copyResultSell() {
            if (!document.getElementById('result-sell').innerHTML.trim()) { alert('먼저 계산하세요!'); return; }
            let text = '【목표매도가 계산 결과】\n';
            document.querySelectorAll('#result-sell table tr').forEach(r => {
                text += [...r.cells].map(c => c.innerText).join('\t') + '\n';
            });
            navigator.clipboard.writeText(text).then(() => alert('결과가 복사되었습니다!'));
        }

        function copyResultGap() {
            if (!document.getElementById('result-gap').innerHTML.trim()) { alert('먼저 괴리율을 입력하세요!'); return; }
            const pct = document.getElementById('gap-pct').textContent;
            const tag = document.getElementById('gap-tag').textContent;
            let text = `【ETF 괴리율】\n괴리율 : ${pct}\n등급 : ${tag}\n\nSmartMoney13 ETF`;
            document.querySelectorAll('#result-gap table tr').forEach(r => {
                text += '\n' + [...r.cells].map(c => c.innerText).join('\t');
            });
            navigator.clipboard.writeText(text).then(() => alert('결과가 복사되었습니다!'));
        }

        function copyResultNav() {
            if (!document.getElementById('result-nav').innerHTML.trim()) { alert('먼저 NAV와 괴리율을 입력하세요!'); return; }
            let text = '【NAV → 시장가 계산】\n';
            document.querySelectorAll('#result-nav table tr').forEach(r => {
                text += [...r.cells].map(c => c.innerText).join('\t') + '\n';
            });
            text += '\nSmartMoney13 ETF';
            navigator.clipboard.writeText(text).then(() => alert('결과가 복사되었습니다!'));
        }

        // 엔터키로 계산 (해당 탭에 따라)
        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const activeTab = document.querySelector('.tab-content.active').id;
                    if (activeTab === 'tab-avg') calcAvg();
                    else if (activeTab === 'tab-sell') calcSell();
                    else if (activeTab === 'tab-gap') calcGap();
                    else if (activeTab === 'tab-navcalc') calcNavPrice();
                }
            });
        });
    </script>
</body>
</html>
